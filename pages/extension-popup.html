<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuickTag LazyMod</title>
    <link rel="stylesheet" href="../styles/extension-popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="brand-group">
          <img class="brand-icon" src="../assets/icon.png" alt="" />
          <div>
            <h1>
              QuickTag
              <span>LazyMod</span>
            </h1>
            <p>Quick controls</p>
          </div>
        </div>

        <a class="about-link" href="about.html" target="_blank" rel="noreferrer">
          <span>About</span>
          <svg class="link-icon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <path d="M9 3h4v4M13 3 7 9M11 9v3.5H3.5v-8H7"></path>
          </svg>
        </a>
      </header>

      <section class="site-card" aria-labelledby="site-title">
        <div class="site-copy">
          <strong id="site-title">Per-site override</strong>
          <span id="site-host" class="site-host">Checking current site…</span>
          <span id="site-status" class="status-copy">Loading site settings…</span>
        </div>
        <label class="switch" aria-label="Enable or disable QuickTag on this site">
          <input id="site-toggle" type="checkbox" disabled />
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </section>

      <section class="connection-card" aria-live="polite">
        <span id="connection-indicator" class="connection-indicator" aria-hidden="true"></span>
        <div class="connection-copy">
          <strong>ComfyUI</strong>
          <span id="connection-status">Checking connection…</span>
        </div>
        <button id="connection-refresh" type="button" class="icon-button" title="Check connection again" aria-label="Check ComfyUI connection again">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 5.5A5.5 5.5 0 1 0 13.2 9M13 2.5v3.7H9.3" /></svg>
        </button>
      </section>

      <section id="update-card" class="update-card" aria-live="polite">
        <div class="update-heading">
          <div>
            <strong>Extension updates</strong>
            <span id="update-version" class="update-version">Current version · loading…</span>
          </div>
          <span id="update-indicator" class="update-indicator" hidden>NEW</span>
        </div>
        <p id="update-status" class="update-status">Checking GitHub…</p>
        <button id="update-download" type="button" class="update-button" disabled>Check for updates</button>
        <div class="update-note">
          <span>Downloads open the GitHub release page. Install the update and reload the extension.</span>
        </div>
      </section>

      <p id="save-error" class="error save-error" role="alert" hidden></p>
    </main>
    <script src="../scripts/extension-popup.js"></script>
  </body>
</html>
